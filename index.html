<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Booking App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>BEAUTY BOOKING.APP</h1>
    <p>Booking made reliable and easy at the comfort of your home</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="bookings.html">Bookings</a>
    <a href="services.html">Services</a>
</nav>


    <!-- BOOKING SECTION -->
    <section>
        <h2>Book an Appointment</h2>

        <form id="bookingForm">

            <input type="text" id="name" placeholder="Full Name" required>

            <input type="email" id="email" placeholder="Email" required>

            <input type="tel" id="tel" placeholder="Phone Number" required>

            <select id="service" required>
                <option value="">Select Service</option>
                <option value="Nails">Nails</option>
                <option value="Lashes">Lashes</option>
            </select>

            <input type="date" id="date" required>
            <input type="time" id="time" required>

            <button type="submit">Book Now</button>

        </form>

        <p id="message"></p>

    </section>

    <!-- HOME CONTENT -->
    <section class="home">

        <div class="home-page">
            <h3>Customize your character</h3>
            <p>Express your inner artistry with all the colors and designs of your liking</p>
        </div>

    </section>

    <!-- GALLERY  -->
    <section id="gallery">
        <h3>ART</h3>
        <div id="image-grid">
            <img src="./meh.jpg" alt="lashes">
            <img src="./download (14).jpg" alt="nails">
            <img src="./_3.jpg" alt="lashes">
            <img src="./nails.jpg" alt="nails">
            <img src="./download (15).jpg" alt="lashes">
            <img src="./Nail Era ❤️.jpg" alt="nails">
            <img src="./download (13).jpg" alt="lashes">
            <img src="./idk.jpg" alt="nails">
        </div>

        

        

    </section>



<footer>
    <p>© 2026 Beauty Booking</p>
</footer>

<script src="script.js"></script>

</body>
</html>
